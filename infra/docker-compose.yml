services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: demurrage-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-demurrage-defender-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-demurrage-defender}
    ports:
      - "5432:5432"
    volumes:
      - demurrage_postgres_data:/var/lib/postgresql/data

volumes:
  demurrage_postgres_data:
